# Written by sgrt-tools' scripts/publish_member.py: edit it there, never in this mirror.
# Installs maprt-emulator from this checkout into a clean environment and runs its tests on every
# supported Python and OS.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # pip 25.1+ installs dependency groups (--group).
      - run: python -m pip install --upgrade "pip>=25.1"
      # A regular (not editable) install, so the tests run against the package as users get it.
      - run: python -m pip install . --group test
      - run: python -m pytest -q
